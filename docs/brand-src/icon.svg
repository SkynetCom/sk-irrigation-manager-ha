<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb6e8"/>
      <stop offset="1" stop-color="#1257c4"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fcf7e"/>
      <stop offset="1" stop-color="#1c9a5a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="badge"><rect x="8" y="8" width="496" height="496" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#badge)">
    <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
    <!-- water jets: parabolic arcs made of drops -->
    <g fill="none" stroke="#fff" stroke-linecap="round">
      <path d="M256 214 Q 150 60 58 300" stroke-width="20" stroke-dasharray="1 34" stroke-dashoffset="-30" opacity=".95"/>
      <path d="M256 214 Q 362 60 454 300" stroke-width="20" stroke-dasharray="1 34" stroke-dashoffset="-30" opacity=".95"/>
      <path d="M256 214 Q 180 120 110 330" stroke-width="15" stroke-dasharray="1 28" stroke-dashoffset="-26" opacity=".7"/>
      <path d="M256 214 Q 332 120 402 330" stroke-width="15" stroke-dasharray="1 28" stroke-dashoffset="-26" opacity=".7"/>
      <path d="M256 186 L 256 100" stroke-width="16" stroke-dasharray="1 28" opacity=".85"/>
    </g>
    <!-- lawn -->
    <path d="M0 360 Q 128 318 256 330 T 512 352 L512 512 L0 512 Z" fill="url(#grass)"/>
    <path d="M0 392 Q 140 360 256 372 T 512 388 L512 512 L0 512 Z" fill="#168a50" opacity=".55"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#gloss)"/>
  </g>
  <!-- pop-up sprinkler -->
  <g>
    <rect x="226" y="246" width="60" height="98" rx="12" fill="#eef4fb"/>
    <rect x="226" y="246" width="60" height="20" rx="8" fill="#cfdbea"/>
    <rect x="238" y="216" width="36" height="36" rx="10" fill="#fff"/>
    <circle cx="256" cy="230" r="7" fill="#1257c4"/>
    <rect x="206" y="330" width="100" height="26" rx="10" fill="#fff"/>
  </g>
</svg>
