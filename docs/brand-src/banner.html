<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  .bg{position:absolute;inset:0;background:radial-gradient(900px 600px at 85% 20%,#1fb6e8 0%,transparent 60%),
      radial-gradient(700px 500px at 0% 100%,#1c9a5a 0%,transparent 55%),linear-gradient(135deg,#0d2b52,#0f4c8a 55%,#1257c4)}
  .drops{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 2px,transparent 2.5px);background-size:28px 28px;mask-image:linear-gradient(90deg,#000,transparent 70%)}
  .left{position:absolute;left:72px;top:92px;width:560px;color:#fff}
  .brand{display:flex;align-items:center;gap:22px}
  .brand img{width:112px;height:112px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
  h1{margin:0;font-size:56px;line-height:1.02;letter-spacing:-1px}
  h1 small{display:block;font-size:24px;font-weight:400;opacity:.8;letter-spacing:.5px;margin-top:6px}
  p{font-size:24px;line-height:1.45;opacity:.92;margin:34px 0 28px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);padding:9px 16px;border-radius:99px;font-size:17px;font-weight:500}
  .shot{position:absolute;right:-120px;top:70px;width:760px;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.45);
        transform:perspective(1600px) rotateY(-14deg) rotateX(4deg);border:1px solid rgba(255,255,255,.25)}
  .shot2{position:absolute;right:250px;top:360px;width:420px;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);
        transform:perspective(1600px) rotateY(-14deg) rotateX(4deg);border:1px solid rgba(255,255,255,.25)}
</style></head><body>
<div class="bg"></div><div class="drops"></div>
<img class="shot" src="../dashboard.png">
<img class="shot2" src="../groups.png">
<div class="left">
  <div class="brand"><img src="icon.svg"><h1>SK Irrigation<small>Manager for Home Assistant</small></h1></div>
  <p>Professional irrigation for Home Assistant: drag &amp; drop groups, multi-start programs, smart conditions and native Rain Bird support.</p>
  <div class="chips"><span class="chip">💧 Rain Bird</span><span class="chip">🧩 Drag &amp; drop</span><span class="chip">🌦️ Conditions</span><span class="chip">⚡ Solar / battery</span><span class="chip">📊 Gantt timeline</span></div>
</div>
</body></html>
